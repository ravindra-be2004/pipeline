apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: sonarqube-scanner
spec:
  params:
  - name: SONAR_HOST_URL
    type: string
  - name: PROJECT_KEY
    type: string
  - name: PROJECT_DIR
    type: string
    default: .
  workspaces:
  - name: source
  steps:
  - name: run-sonarqube
    image: docker.io/sonarsource/sonar-scanner-cli:4.5@sha256:b8c95a37025f3c13162118cd55761ea0b2a13d1837f9deec51b7b6d82c52040a #sonarsource/sonar-scanner-cli:latest
    workingDir: $(workspaces.source.path)/$(params.PROJECT_DIR)
    env:
    - name: SONAR_TOKEN
      valueFrom:
        secretKeyRef:
          name: sonarqube-token
          key: SONAR_TOKEN
    script: |
      #!/bin/sh
      sonar-scanner \
        -Dsonar.projectKey=$(params.PROJECT_KEY) \
        -Dsonar.sources=. \
        -Dsonar.host.url=$(params.SONAR_HOST_URL) \
        -Dsonar.login=$SONAR_TOKEN
        #      ls $(workspaces.source.path)/$(params.PROJECT_DIR)



